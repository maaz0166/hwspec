name: Python wheels

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install wheel build tools
        run: python -m pip install "cibuildwheel>=3.3,<5" build twine
      - name: Build and test Windows x64 wheels
        run: python -m cibuildwheel --platform windows --output-dir wheelhouse
      - name: Build source distribution
        run: python -m build --sdist --outdir wheelhouse
      - name: Check package metadata
        run: python -m twine check wheelhouse/*
      - uses: actions/upload-artifact@v4
        with:
          name: hwspec-python-windows-x64
          path: wheelhouse/*
