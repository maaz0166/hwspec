name: Python wheels

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install wheel build tools
        run: python -m pip install "cibuildwheel>=3.3,<5" build twine
      - name: Build native executable for Python parity tests
        shell: pwsh
        run: |
          cmake -S . -B build/native-parity -G 'Visual Studio 17 2022' -A x64 -DHWSPEC_BUILD_PYTHON=OFF -DHWSPEC_BUILD_TESTS=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/native-parity --config Release --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "HWSPEC_NATIVE_EXE=$((Resolve-Path build/native-parity/Release/hwspec.exe).Path)" >> $env:GITHUB_ENV
      - name: Freeze source distribution
        run: python -m build --sdist --outdir wheelhouse
      - name: Build and test wheels from the frozen source distribution
        shell: pwsh
        run: |
          $source = Get-ChildItem wheelhouse -Filter '*.tar.gz'
          if (@($source).Count -ne 1) { throw 'Expected exactly one source distribution' }
          python -m cibuildwheel $source.FullName --platform windows --output-dir wheelhouse
      - name: Check package metadata
        run: python -m twine check wheelhouse/*
      - uses: actions/upload-artifact@v4
        with:
          name: hwspec-python-windows-x64
          path: wheelhouse/*
