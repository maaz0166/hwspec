[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hwspec"
version = "0.0.1"
description = "A command-line tool that shows your PC's hardware specs. Work in progress."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MuhammadMaaz" }]
keywords = ["hardware", "specs", "system-information", "cli", "windows"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]

[tool.setuptools.packages.find]
where = ["src"]
